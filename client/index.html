<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>DJAchat</title>
  <link rel="icon" href="emblema-chamada.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Barra da janela (só no app desktop): arrasta a janela; minimizar, maximizar e fechar (bandeja ou sair, conforme Configurações) -->
<header id="barraJanela" class="hidden">
  <div class="arrastar"><img src="emblema-chamada.svg" alt=""><span>DJAchat</span></div>
  <div class="botoes-janela">
    <button type="button" id="jMinimizar" title="Minimizar"><i data-ic="minus"></i></button>
    <button type="button" id="jMaximizar" title="Maximizar"><i data-ic="square"></i></button>
    <button type="button" id="jFechar" class="fechar" title="Fechar (o DJAchat continua na bandeja)"><i data-ic="x"></i></button>
  </div>
</header>

<!-- Tela de entrada -->
<div id="login" class="screen">
  <form id="loginForm" class="card">
    <div class="logo"><img src="emblema-chamada.svg" alt=""></div>
    <h1>DJAchat</h1>
    <p class="muted">Entre no servidor da galera</p>
    <label>Endereço do servidor<input id="lServer" placeholder="100.64.0.1:3000" required></label>
    <label>Seu apelido<input id="lName" maxlength="32" placeholder="ex.: Liniker" required></label>
    <label>Senha do servidor <span class="muted">(se tiver)</span><input id="lPass" type="password"></label>
    <button type="submit" class="primary">Entrar</button>
    <p id="lError" class="error"></p>
  </form>
</div>

<!-- App -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <header class="server-name">DJAchat <span id="connDot" class="dot ok" title="Conectado"></span></header>
    <div id="channelList">
      <div class="cat"><span>Canais de texto</span><button class="icon add" data-kind="text" title="Criar canal de texto"><i data-ic="plus"></i></button></div>
      <div id="textChannels"></div>
      <div class="cat"><span>Canais de voz</span><button class="icon add" data-kind="voice" title="Criar canal de voz"><i data-ic="plus"></i></button></div>
      <div id="voiceChannels"></div>
      <div class="cat hidden" id="dmCat"><span>Mensagens diretas</span></div>
      <div id="dmList"></div>
    </div>

    <div id="voicePanel" class="hidden">
      <div class="vp-info">
        <div class="vp-status">Voz conectada</div>
        <div id="vpChannel" class="muted small"></div>
      </div>
      <div class="vp-buttons">
        <button id="btnScreen" class="pill" title="Compartilhar tela"><i data-ic="screen-share"></i><span>Tela</span></button>
        <button id="btnSoundboard" class="pill" title="Soundboard"><i data-ic="music"></i><span>Sons</span></button>
        <button id="btnLeave" class="icon danger" title="Sair da voz"><i data-ic="phone-off"></i></button>
      </div>
    </div>

    <footer id="userPanel">
      <div class="avatar" id="meAvatar"></div>
      <div class="me-name"><b id="meName"></b><span class="muted small">online</span></div>
      <button id="btnMute" class="icon" title="Mutar microfone"><i data-ic="mic"></i></button>
      <button id="btnDeafen" class="icon" title="Ensurdecer"><i data-ic="headphones"></i></button>
      <button id="btnSettings" class="icon" title="Configurações"><i data-ic="settings"></i></button>
    </footer>
  </aside>

  <main id="main">
    <header id="mainHeader"><span id="chanTitle"></span><span id="chanSub" class="muted small"></span>
      <div class="acoes-topo">
        <button type="button" id="btnFixadas" class="icon" title="Mensagens fixadas"><i data-ic="pin"></i></button>
        <label class="busca" title="Buscar em todas as conversas (Ctrl+F)"><i data-ic="search"></i><input id="busca" placeholder="Buscar" autocomplete="off"></label>
      </div>
    </header>

    <!-- Visão de texto -->
    <section id="textView">
      <div id="messages"></div>
      <div id="typing" class="muted small"></div>
      <div id="uploads"></div>
      <div id="respondendo" class="hidden"></div>
      <div id="anexos"></div>
      <form id="composer">
        <button type="button" id="btnAttach" class="icon" title="Anexar arquivo"><i data-ic="paperclip"></i></button>
        <input type="file" id="fileInput" multiple hidden>
        <textarea id="msgInput" rows="1" placeholder="Conversar…"></textarea>
        <button type="button" id="btnEmoji" class="icon" title="Emoji"><i data-ic="smile"></i></button>
        <button type="button" id="btnSend" class="icon" title="Enviar (Enter)"><i data-ic="send-horizontal"></i></button>
      </form>
      <div id="dropHint" class="hidden">Solte para enviar</div>
    </section>

    <!-- Visão de voz -->
    <section id="voiceView" class="hidden">
      <div id="stage"></div>
      <div id="tiles"></div>
      <div class="voice-empty muted" id="voiceHint"></div>
    </section>
  </main>

  <!-- painel de busca e de mensagens fixadas (fica por cima da lista de membros) -->
  <aside id="painel" class="hidden">
    <div class="painel-topo"><b id="painelTitulo"></b><button type="button" class="icon" id="painelFechar" title="Fechar (Esc)"><i data-ic="x"></i></button></div>
    <div id="painelLista"></div>
  </aside>

  <aside id="members">
    <div class="cat"><span>Online — <b id="onlineCount">0</b></span></div>
    <div id="memberList"></div>
  </aside>
</div>

<!-- Soundboard -->
<div id="soundboard" class="popover hidden">
  <div class="pop-head">
    <b>Soundboard</b>
    <label class="small muted">Volume <input type="range" id="sbVolume" min="0" max="1" step="0.05" value="0.6"></label>
  </div>
  <div id="sbGrid"></div>
  <div class="pop-foot">
    <button id="sbUpload" class="pill"><i data-ic="plus"></i><span>Adicionar som</span></button>
    <input type="file" id="sbFile" accept="audio/*" hidden>
    <span class="muted small">mp3/ogg/wav até 3 MB</span>
  </div>
</div>

<!-- Modal genérico -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalCancel">Cancelar</button>
      <button id="modalOk" class="primary">OK</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="icones.js"></script>
<script src="texto.js"></script>
<script src="emojis.js"></script>
<script src="nucleo.js"></script>
<script src="chat.js"></script>
<script src="voz.js"></script>
<script src="configuracoes.js"></script>
<script src="menus.js"></script>
<script src="perfil.js"></script>
<script src="busca.js"></script>
<script src="app.js"></script>
</body>
</html>
